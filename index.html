<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f8cff'/%3E%3Ctext x='50' y='72' font-size='64' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E"
    />
    <title>ONET CLASSIC</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1020;
        overflow: hidden; /* tanpa scroll bar */
        overscroll-behavior: none; /* matikan pull-to-refresh / bounce */
        touch-action: none; /* sentuhan sepenuhnya untuk game: tanpa scroll/zoom bawaan */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        position: fixed; /* cegah iOS Safari menggeser halaman */
        inset: 0;
      }
      #game-container {
        width: 100%;
        height: 100%; /* fallback */
        height: 100dvh; /* mengikuti tinggi viewport nyata saat address bar HP muncul/hilang */
        /* Beri ruang aman untuk notch / gesture bar bila ada */
        padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        box-sizing: border-box;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: rgba(11, 16, 32, 0.94);
        color: #dbe6ff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        line-height: 1.5;
        text-align: center;
        touch-action: auto;
      }
      #rotate-hint.visible {
        display: flex;
      }
      #rotate-hint .rotate-icon {
        font-size: 64px;
        color: #7aa9ff;
      }
      #rotate-hint p {
        margin: 0;
      }
      #rotate-hint button {
        min-width: 160px;
        min-height: 48px;
        padding: 0 24px;
        border: 2px solid #ffffff;
        border-radius: 10px;
        background: #4f8cff;
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
